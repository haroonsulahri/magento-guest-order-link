name: Package quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, simplexml
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate composer.json --strict --no-check-publish

      - name: Lint PHP files
        run: find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check privacy, secrets and XML
        run: php dev/check-release.php .

      - name: Build and verify Linux release archive
        run: bash bin/build-release.sh 0.0.0-ci dist

      - name: Upload verified archive
        uses: actions/upload-artifact@v7
        with:
          name: link-guest-order-to-customer-ci
          path: dist/*.zip
          if-no-files-found: error
